name: verify

# Solo verificación (decisión de Julio, Feature 001): sin despliegues ni secretos.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Origen del build de verificación (ADR 006): las e2e corren en localhost:3100.
  # No es el de producción; ese lo fija el despliegue (feature 006).
  SITE_ORIGIN: 'http://localhost:3100'

jobs:
  verify:
    runs-on: ubuntu-latest
    # 30 min: desde la feature 006 la CI corre además Firefox y el arnés HTTPS con WebKit (P-52).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: tests/unit/legal-date.test.ts contrasta la fecha de
          # Legal con el último commit de src/content/legal.ts (spec 002 §3.6).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: lint + typecheck + unit + build
        run: npm run verify
      - name: Dependencias de producción (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Navegadores para e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: e2e (rutas, i18n, accesibilidad, encabezados; CSP también en Firefox)
        run: npm run test:e2e
      # P-17 / P-52: WebKit no puede probarse sobre http://localhost (sube los scripts a HTTPS). El arnés
      # reconstruye con un origen HTTPS de pruebas y corre CSP, 404 y navegación en los tres motores.
      - name: CSP, 404 y navegación bajo HTTPS (Chromium, Firefox y WebKit)
        run: node tests/https/run.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
