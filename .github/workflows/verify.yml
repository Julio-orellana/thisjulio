name: verify

# Solo verificación (decisión de Julio, Feature 001): sin despliegues ni secretos.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Origen del build de verificación (ADR 006): las e2e corren en localhost:3100.
  # No es el de producción; ese lo fija el despliegue (feature 006).
  SITE_ORIGIN: 'http://localhost:3100'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: lint + typecheck + unit + build
        run: npm run verify
      - name: Dependencias de producción (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Navegador para e2e
        run: npx playwright install --with-deps chromium
      - name: e2e (rutas, i18n, accesibilidad, encabezados)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
